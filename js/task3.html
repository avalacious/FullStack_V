
<!DOCTYPE html>
<html>
<head>
    <title>Whack a Mole Game</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f2f2f2;
        }

        h1 {
            color: darkgreen;
        }

        #game {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 10px;
            justify-content: center;
            margin-top: 25px;
        }

        .cell {
            width: 100px;
            height: 100px;
            background-color: lightgreen;
            border: 2px solid green;
            border-radius: 10px;
            cursor: pointer;
        }

        .mole {
            background-color: orange;
        }

        button {
            margin: 15px;
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Whack-a-Mole Game</h1>
    <p>Score: <span id="score">0</span></p>
    <p>Time Left: <span id="time">30</span> seconds</p>
    <button id="startBtn">Start Game</button>
    <div id="game">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
    </div>
    <p id="message">Click Start Game to play!</p>
    <script src="script.js"></script>
</body>
</html>
