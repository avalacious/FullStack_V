<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container {
        flex-direction: row;
        outline: 3px solid black;
        height: 90vh;
        display: flex;
        justify-content: center;
        align-items: center;
        
    }
    .container>div {
        color: white;
        width: 150px;
        height: 100px;

    }
    #box1 {
        background-color: rgb(230, 132, 132);
        flex-basis: 150px; 
        flex-grow: 1;
        text-align: left;
    }

    #box2 {
        background-color: rgb(111, 111, 203);
        flex-basis: 150px;
        flex-grow: 1;
        text-align: center;
    }
    #box3 {
        background-color: rgb(100, 186, 100);
        flex-basis: 150px;
        flex-grow: 1;
        text-align: right;
    }

</style>

<body>
    <div class="container">
        <div id="box1">Box 1</div>
        <div id="box2">Box 2</div>
        <div id="box3">Box 3</div>
    </div>
</body>
</html>
