<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
.container{
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    outline: 1px solid black;
    height: 500px;
    width: 500px;

}

.container>div{
    outline: 1px dashed grey;
}

#box1 {
    grid-column:1/3;
    grid-row:1/3;
    background-color: blue;
    z-index:2;
}
#box6 {
    grid-column: 2/3;
    grid-row:1/2;
    background-color: red;
    z-index:1;
}
</style>
<body>
    <div class="container">
        <div id="box1">1</div>
        <div id="box2">2</div>
        <div id="box3">3</div>
        <div id="box4">4</div>
        <div id="box5">5</div>
        <div id="box6">6</div>
        
    </div>
</body>
</html>
