<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <style>
   
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px; 
            max-width: 1200px;
            margin: 0 auto;
        }

     
        .gallery-item {
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            background-color: #fff;
            aspect-ratio: 1 / 1; 
        }

    
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
            transition: transform 0.3s ease;
        }
        .gallery-item:hover img {
            transform: scale(1.05);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>My Photo Gallery</h1>

    <div class="gallery-container">
        
        <div class="gallery-item">
            <img src="https://picsum.photos" alt="Gallery Image 1">
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos" alt="Gallery Image 2">
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos" alt="Gallery Image 3">
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos" alt="Gallery Image 4">
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos" alt="Gallery Image 5">
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos" alt="Gallery Image 6">
        </div>
    </div>

</body>
</html>
