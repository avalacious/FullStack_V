<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
@layer special, base;  /* base layer is declared first so it will be overridden by special layer */

@layer base{
    body {
        background-color: white;
    }
 p {
    font-size: 30px;
    color: red;
 }
 button{
    font-size: 30px;
    border-radius: 50%;
    width:150px;
    height:150px;
    background-color: white;
    border: 1px solid grey;
    box-shadow: 3px 3px 5px grey;
 }
 button:active {
    box-shadow: inset 3px 3px grey;
 }
}

@layer special {
body {
    background-color:black;
}
 p{
    color:aliceblue  /* blue overrides red because it is declared later in the code */
 }
 button {
    border: 1px solid white;  /* white overrides grey because it is declared later in the code */
    box-shadow: inset 3px 3px 5px white;  /* white overrides grey because it is declared later in the code */
 }
 button:active {
    box-shadow: inset 3px 3px white;  /* white overrides grey because it is declared later in the code */
 }
}
</style>
<body>
  /* learn about cascade layers in css from mdn for theory part also do BEM methodology */
    <p> Specificity </p> 
    <button>Click Me</button>
</body>
</html>
