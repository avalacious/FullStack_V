<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(100px, 1fr));
            grid-template-areas: 
                "box1 box1 box2"
                "box1 box1 box3"
                "box4 box4 box5"
                "box6 box6 box7"
                "box8 box9 box7";

            gap: 3%;
        }

        @media (max-width: 500px) {
            .container {
                grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
                grid-template-areas: 
                    "box1 box2 box3"
                    "box4 box5 box6"
                    "box8 box9 box7";
            }
            .container {
                grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
                grid-template-areas: 
                    "box1 box1"
                    "box2 box3"
                    "box4 box5"
                    "box6 box7"
                    "box8 box9";
            }
        }
        .box {
            background-color: blue;
            text-align: center;
            height: 100px;
            
            }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" style="grid-area: box1;"></div>
        <div class="box" style="grid-area: box2;"></div>
        <div class="box" style="grid-area: box3;"></div>
        <div class="box" style="grid-area: box4;"></div>
        <div class="box" style="grid-area: box5;"></div>
        <div class="box" style="grid-area: box6;"></div>
        <div class="box" style="grid-area: box7;"></div>
        <div class="box" style="grid-area: box8;"></div>
        <div class="box" style="grid-area: box9;"></div>

    </div>
</body>
</html>
