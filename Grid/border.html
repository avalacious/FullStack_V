<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradient Border Examples</title>
  <style>
    
    body {
      background-color: #0f0f12;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      min-height: 100vh;
      margin: 0;
    }

    h2 {
      font-size: 1.2rem;
      color: #a0a0a5;
      display: block;
      margin-block-start: 1em;
        margin-block-end: 1em;
        margin-inline-start: 0px;
        margin-inline-end: 0px;
        unicode-bidi: isolate;
    }

  
    .rounded-gradient-border {
      width: 320px;
      padding: 25px;
      border: 6px solid transparent; 
      border-radius: 20px; 
      background: 
        linear-gradient(#1e1e24, #1e1e24) padding-box,
        linear-gradient(to right, #ff4e50, #f9d423, #40c0cb, #e100ff) border-box;
    }

 </style>
</head>
<body>
 <div class="rounded-gradient-border">
    <h2> BOX </h2>
  </div>

</body>
</html>
