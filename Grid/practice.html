<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            width: 100vh;
            height: 100vh;
        }
        .box {
            color: white;
            text-align: center;
            height: 100px;
            width: 100px;
            font-weight: 900;

            
        }

        #box1 {
            position: sticky;
            top:100%;
            left: 40%;
        }

        #box2 {
            position: sticky;
            top: 100%;
        }

        #box3 {
            position: relative;
            top: 100%;
        }

        #box4 {
            position: relative;
            top: 100%;
        }

        #box5 {
            position: relative;
            top: 100%;
        }

        
    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="box1" style="background-color: blue;"></div>
        <div class="box" id="box2" style="background-color: red;"></div>
        <div class="box" id="box3" style="background-color: green;"></div>
        <div class="box" id="box4" style="background-color: yellow;"></div>
        <div class="box" id="box5" style="background-color: purple;"></div>
        <div class="box" id="box6" style="background-color: orange;"></div>
        <div class="box" id="box7" style="background-color: pink;"></div>
        <div class="box" id="box8" style="background-color: brown;"></div>
        <div class="box" id="box9" style="background-color: gray    ;"></div>

    </div>
</body>
</html>
