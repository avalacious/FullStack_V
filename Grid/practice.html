<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

    .container {
        width: 100%; 
        min-height: 100vh;
    }

    .box {
        color: white;
        text-align: center;
        height: 700px;
        width: 100%; 
        font-weight: 100;
    }
        #box1 {
            position: sticky;
            top:0%;
            background-color: linear-gradient(to right, black, white);
            
            
        }

        #box2 {
            position: sticky;
            top: 0%
            
            
        }

        #box3 {
            position: sticky;
            top: 0%;
        }

        #box4 {
            position: sticky;
            top: 0%;
        }

        #box5 {
            position: sticky;
            top: 0%;
        }

        
    </style>
</head>
<body>
    <div class="container">

            <img src="img1.avif" alt="Image 1" style="width: 100%; height: 100%;">
        </div>
        <div class="box" id="box2">
            <img src="img2.jpg" alt="Image 2" style="width: 100%; height: 100%; background-color: linear-gradient(to right, black, white);">
        </div>
        <div class="box" id="box3" >

        </div>
        <div class="box" id="box4" >

        </div>
        <div class="box" id="box5" style="background-color: purple;">

    </div>

</html>
