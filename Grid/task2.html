<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Layout</title>

    <style>
        .container{
            display: grid;
            grid-template-columns: 200px 1fr 1fr;
            grid-template-rows: 70px 200px 120px 70px;
            gap: 10px;
            height: 100vh;
        }

        .box{
            border: 2px solid black;
            background-color: lightblue;
            text-align: center;
            padding-top: 20px;
            font-size: 20px;
        }

        .header{
            grid-column: 1 / 4;
        }

        .sidebar{
            grid-row: 2 / 4;
        }

        .main{
            grid-column: 2 / 4;
        }

        .card1{
            grid-column: 2 / 3;
        }

        .card2{
            grid-column: 3 / 4;
        }

        .footer{
            grid-column: 1 / 4;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="box header">Header</div>

    <div class="box sidebar">Sidebar</div>

    <div class="box main">Main Content</div>

    <div class="box card1">Card 1</div>

    <div class="box card2">Card 2</div>

    <div class="box footer">Footer</div>

</div>

</body>
</html>
