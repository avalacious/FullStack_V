<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Gradient Images</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            width: 100%; 
            min-height: 100vh;
            background-color: #0f0f15; 
        }

        .box {
            position: sticky;
            top: 0;
            height: 100vh; 
            width: 100%; 
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            overflow: hidden;
        }

       
        .box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        
        #box1 {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
        }

        #box2 {
            background: linear-gradient(135deg, #2c3e50, #000000);
        }

        #box3 {
            background: linear-gradient(135deg, #4b6cb7, #182848);
        }

        #box4 {
            background: linear-gradient(135deg, #200122, #6f0000);
        }

        #box5 {
            background: linear-gradient(135deg, #0d2b45, #203c56);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="box1">
            <img src="img1.avif" alt="Image 1">
        </div>
        <div class="box" id="box2">
            <img src="img2.jpg" alt="Image 2">
        </div>
        <div class="box" id="box3">
            <img src="img3.jpg" alt="Image 3">
        </div>
        <div class="box" id="box4">
            <img src="ikmg4.jpg" alt="Image 4">
        </div>
        <div class="box" id="box5">
            <img src="img5.jpg" alt="Image 5">
        </div>
    </div>
</body>
</html>
